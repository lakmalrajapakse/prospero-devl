<template>
    <!-- Spinner -->
    <template lwc:if={isLoading}>
        <div>
            <lightning-spinner
                alternative-text="Loading search setting">
            </lightning-spinner>
        </div>
    </template>
    <div class="slds-combobox_container">
        <div class={dropdownClass} role="combobox">
            <!-- Input -->
            <lightning-input
                type="text"
                label={label}
                value={searchTerm}
                placeholder={placeholder}
                onchange={handleSearch}>
            </lightning-input>

            <!-- Show Dropdown -->
            <template if:true={showDropdown}>
                <template lwc:if={hasResults}>
                    <div class="slds-dropdown slds-dropdown_fluid slds-dropdown_length-5">
                        <ul  class="slds-listbox slds-listbox_vertical"  role="listbox">
                            <template  for:each={searchResults} for:item="record">
                                <li key={record.value} class="slds-listbox__item">
                                    <div
                                        class="slds-listbox__option slds-listbox__option_plain slds-media slds-media_small slds-p-horizontal_small slds-p-vertical_x-small slds-text-body_regular"
                                        data-id={record.value}
                                        data-label={record.label}
                                        onclick={handleSelect}>
                                        <div class="slds-media__body">
                                            <span class="slds-truncate">
                                                {record.label}
                                            </span>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <template lwc:else>
                   <div class="slds-dropdown slds-dropdown_fluid slds-dropdown_length-5">
                        <div class="slds-p-horizontal_small slds-p-vertical_small slds-text-color_weak">
                            No Records Found
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </div>

    <!-- Show Pills -->
    <template if:true={selectedRecords}>
        <div class="slds-m-top_small">

            <lightning-pill-container
                items={selectedRecords}
                onitemremove={handleRemove}>
            </lightning-pill-container>

        </div>
    </template>

</template>
