<template>
    
    <!-- Call List Button -->
    <div class="slds-grid slds-grid_align-end slds-m-bottom_small">
        <lightning-button
            variant="brand"
            label="Add To Call List"
            name="callList"
            onclick={callListHandler}
            disabled={disableCallList}
            >
        </lightning-button>
    </div>

    <!-- Datatable to render the records, Sort and handle selection -->
    <div style={tableStyle}>
        <lightning-datatable
            key-field="Id"
            data={paginatedRecords}
            columns={columns}
            show-row-number-column
            selected-rows={selectedRowsForPage}
            onrowselection={handleRowSelection}
            default-sort-direction={defaultSortDirection}
            sorted-direction={sortDirection}
            sorted-by={sortedBy}
            onsort={onHandleSort}>
        </lightning-datatable>
    </div>

    <!-- Pagination controls -->
    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-top_small">
        <div class="slds-text-body_small slds-text-color_weak">
            {pageRangeLabel}
        </div>
        <div class="slds-grid slds-grid_vertical-align-center">
            <lightning-button
                label="Previous"
                icon-name="utility:chevronleft"
                onclick={handlePreviousPage}
                disabled={isFirstPage}>
            </lightning-button>
            <span class="slds-p-horizontal_small">
                Page {currentPage} of {totalPages}
            </span>
            <lightning-button
                label="Next"
                icon-name="utility:chevronright"
                icon-position="right"
                onclick={handleNextPage}
                disabled={isLastPage}>
            </lightning-button>
        </div>
    </div>

    <!--  Modal pop up for calllist record creation -->
      <template if:true={showCallListModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <!-- Spinner -->
                    <template lwc:if={isLoading}>
                            <div>
                                <lightning-spinner alternative-text="Loading search setting" ></lightning-spinner>
                            </div>
                    </template>
                <div class="slds-modal__container">
                    <!-- Header -->
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">
                            Create Call List
                        </h2>
                    </header>
                    <!-- Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form
                            object-api-name="TR1__Call_List__c"
                            record-type-id={defaultRecordTypeId}
                            onsuccess={handleSuccess}
                            onerror={handleError}>
                            <lightning-messages>
                            </lightning-messages>
                            <lightning-input-field
                                field-name="Name"
                                onchange={handleNameChange}>
                            </lightning-input-field>
                            <div class="slds-m-top_medium slds-text-align_right">
                                <lightning-button
                                    label="Cancel"
                                    onclick={closeModal}>
                                </lightning-button>
                                <lightning-button
                                    class="slds-m-left_small"
                                    variant="brand"
                                    type="submit"
                                    label="Save">
                                </lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    
</template>
