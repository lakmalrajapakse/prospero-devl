<template>
    <lightning-card title="Commission Splits" icon-name="standard:people">
        <div class="slds-p-around_medium">
            <template if:true={showWarning}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">Your changes will not be saved until the overall percentage of the commission split is 100%.</div>
            </template>

            <div class="slds-m-bottom_small">
                <a href="javascript:void(0);" onclick={handleAddRow}>
                    <lightning-icon icon-name="utility:adduser" size="x-small" variant="brand" class="slds-m-right_xx-small"></lightning-icon>
                    Add Row
                </a>
            </div>

            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr>
                        <th>Consultant</th>
                        <th>Team</th>
                        <th>Percentage</th>
                        <th>Type</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr key={row.Id}>
                            <td>{row.consultantName}</td>
                            <td>{row.teamName}</td>
                            <td><lightning-input variant="label-hidden" type="number" value={row.percentage} data-id={row.Id} min="0" onchange={handlePercentageChange}></lightning-input></td>
                            <td><lightning-combobox variant="label-hidden" value={row.type} options={typeOptions} data-id={row.Id} onchange={handleTypeChange}></lightning-combobox></td>
                            <td><lightning-button-icon icon-name="utility:delete" alternative-text="Delete" title="Delete" data-id={row.Id} onclick={handleDelete}></lightning-button-icon></td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <template if:true={showPicker}>
                <div class="slds-m-top_medium">
                    <div class="slds-grid slds-gutters slds-grid_vertical-align-center">
                        <div class="slds-col slds-size_6-of-12">
                            <lightning-record-picker label="Consultant" placeholder="Search Consultants..." object-api-name="User" value={selectedConsultantId} filter={userFilter} onchange={handlePickerSelect}></lightning-record-picker>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <lightning-input type="number" label="Percentage" value={newPercentage} min="1" onchange={handleNewPercentageChange}></lightning-input>
                        </div>
                        <div class="slds-col slds-size_3-of-12">
                            <div class="slds-text-color_error slds-text-body_small slds-m-top_large">{remaining}</div>
                        </div>
                    </div>
                    <div class="slds-m-top_small">
                        <lightning-button variant="brand" label="Add Consultant" onclick={handleAddConsultant} disabled={disableAddConsultant}></lightning-button>
                        <lightning-button class="slds-m-left_small" label="Cancel" onclick={handleCancelPicker}></lightning-button>
                    </div>
                </div>
            </template>

            <template if:true={hasChanges}>
                <div class="slds-m-top_medium slds-text-align_right">
                    <lightning-button label="Save" variant="brand" onclick={handleSave} disabled={saveDisabled}></lightning-button>
                </div>
            </template>

            <template if:true={deletedRows.length}>
                <div class="slds-m-top_large">
                    <div class="slds-text-heading_small slds-m-bottom_small">Deleted Commission Splits</div>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr>
                                <th>Consultant</th>
                                <th>Team</th>
                                <th>Percentage</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={deletedRows} for:item="row">
                                <tr key={row.Id}>
                                    <td>{row.consultantName}</td>
                                    <td>{row.teamName}</td>
                                    <td>{row.percentage}%</td>
                                    <td>{row.type}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
