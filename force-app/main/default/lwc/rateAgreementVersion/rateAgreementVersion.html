<template>
    <template lwc:if={isLoading}>
        <lightning-spinner alternative-text="Loading version records" size="small"></lightning-spinner>
    </template>

    <div class="version-body">
        <lightning-tabset>
            <lightning-tab label="Rate Agreement Scale" value="scales">
                <template lwc:if={hasScales}>
                    <div class={scaleTableClass}>
                        <lightning-datatable key-field="Id" data={scales} columns={scaleColumns} onsave={handleScaleSave} hide-checkbox-column></lightning-datatable>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-p-around_medium slds-text-color_weak">No Rate Agreement Scales found.</p>
                </template>
            </lightning-tab>

            <lightning-tab label="Default Employer On Cost" value="onCosts">
                <c-ra-employer-on-cost version-id={versionId} is-default={trueValue}></c-ra-employer-on-cost>
            </lightning-tab>

            <lightning-tab label="Rate Agreement Line" value="lines">
                <div class="slds-p-around_small slds-grid slds-grid_align-end">
                    <lightning-button-icon icon-name="utility:add" variant="brand" title="Add Rate Agreement Line" alternative-text="Add Rate Agreement Line" onclick={openAddLineModal}></lightning-button-icon>
                </div>

                <template lwc:if={hasLines}>
                    <div class="table-wrapper">
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate">Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Worker Type</div></th>
                                    <th scope="col"><div class="slds-truncate">Calc Type</div></th>
                                    <th scope="col"><div class="slds-truncate">Margin Value</div></th>
                                    <th scope="col"><div class="slds-truncate">Min Scale</div></th>
                                    <th scope="col"><div class="slds-truncate">Max Scale</div></th>
                                    <th style="width: 7rem;"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={lines} for:item="line">
                            <tr key={line.Id} class="slds-hint-parent">
                                <td><div class="slds-truncate">{line.Name}</div></td>
                                <td>
                                    <lightning-combobox
                                        variant="label-hidden"
                                        value={line.Worker_Type__c}
                                        options={workerTypeOptions}
                                        dropdown-alignment="auto"
                                        data-id={line.Id}
                                        data-field="Worker_Type__c"
                                        onchange={handleLineCellChange}>
                                    </lightning-combobox>
                                </td>
                                <td>
                                    <lightning-combobox
                                        variant="label-hidden"
                                        value={line.Calc_Type__c}
                                        options={calcTypeOptions}
                                        dropdown-alignment="auto"
                                        data-id={line.Id}
                                        data-field="Calc_Type__c"
                                        onchange={handleLineCellChange}>
                                    </lightning-combobox>
                                </td>
                                <td class="value-cell">
                                    <lightning-input
                                        type="number"
                                        step="0.01"
                                        variant="label-hidden"
                                        value={line.Margin_Value__c}
                                        data-id={line.Id}
                                        data-field="Margin_Value__c"
                                        onchange={handleLineCellChange}>
                                    </lightning-input>
                                </td>
                                <td>
                                    <lightning-record-picker
                                        variant="label-hidden"
                                        object-api-name="Rate_Agreement_Scale__c"
                                        value={line.Min_Scale__c}
                                        filter={scaleFilter}
                                        data-id={line.Id}
                                        data-field="Min_Scale__c"
                                        onchange={handleLineCellChange}>
                                    </lightning-record-picker>
                                </td>
                                <td>
                                    <lightning-record-picker
                                        variant="label-hidden"
                                        object-api-name="Rate_Agreement_Scale__c"
                                        value={line.Max_Scale__c}
                                        filter={scaleFilter}
                                        data-id={line.Id}
                                        data-field="Max_Scale__c"
                                        onchange={handleLineCellChange}>
                                    </lightning-record-picker>
                                </td>
                                <td>
                                    <template lwc:if={line.isDirty}>
                                        <lightning-button-icon icon-name="utility:save" title="Save" alternative-text="Save" data-id={line.Id} onclick={handleSaveLineRow}></lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:close" title="Cancel" alternative-text="Cancel" data-id={line.Id} onclick={handleCancelLineRow}></lightning-button-icon>
                                    </template>
                                    <template lwc:else>
                                        <lightning-button-icon icon-name="utility:preview" title="View Employer On Cost" alternative-text="View Employer On Cost" data-id={line.Id} onclick={handleViewOnCostClick}></lightning-button-icon>
                                        <lightning-button-icon icon-name="utility:delete" title="Delete Line" alternative-text="Delete Line" data-id={line.Id} onclick={handleDeleteLineClick}></lightning-button-icon>
                                    </template>
                                </td>
                            </tr>
                        </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else>
                    <p class="slds-p-around_medium slds-text-color_weak">No Rate Agreement Lines found.</p>
                </template>
            </lightning-tab>
        </lightning-tabset>
    </div>

    <template lwc:if={showAddLineModal}>
        <c-add-rate-agreement-line version-id={versionId} onclose={closeAddLineModal} onsuccess={handleAddLineSuccess}></c-add-rate-agreement-line>
    </template>

    <template lwc:if={showLineOnCostModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon class="slds-modal__close" icon-name="utility:close" alternative-text="Close" onclick={closeLineOnCostModal}></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Employer On Cost</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <c-ra-employer-on-cost version-id={versionId} line-id={selectedLineId}></c-ra-employer-on-cost>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeLineOnCostModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
