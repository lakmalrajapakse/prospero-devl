<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <lightning-button-icon
                    class="slds-modal__close"
                    icon-name="utility:close"
                    alternative-text="Close"
                    onclick={close}>
                </lightning-button-icon>
                <h2 class="slds-text-heading_medium">{modalTitle}</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <template lwc:if={isSaving}>
                    <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                </template>

                <!-- Edit mode: update Effective Date on the existing version -->
                <template lwc:if={isEditMode}>
                    <lightning-record-edit-form
                        object-api-name="Rate_Agreement_Version__c"
                        record-id={versionId}
                        onsubmit={handleEditSubmit}
                        onsuccess={handleEditSuccess}
                        onerror={handleError}>

                        <lightning-messages></lightning-messages>
                        <lightning-input-field field-name="Effective_Date__c"></lightning-input-field>

                        <div class="slds-m-top_medium slds-text-align_right">
                            <lightning-button label="Cancel" onclick={close} disabled={isSaving}></lightning-button>
                            <lightning-button class="slds-m-left_small" type="submit" label="Save" variant="brand" disabled={isSaving}></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </template>

                <!-- Clone mode: copy scales/lines/on-costs into a new version -->
                <template lwc:if={isCloneMode}>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                        This copies the scales, lines, and employer on-costs from the selected version into a new version with the effective date below.
                    </p>

                    <lightning-input
                        type="date"
                        label="New Effective Date"
                        value={newEffectiveDate}
                        onchange={handleDateChange}
                        required>
                    </lightning-input>

                    <div class="slds-m-top_medium slds-text-align_right">
                        <lightning-button label="Cancel" onclick={close} disabled={isSaving}></lightning-button>
                        <lightning-button
                            class="slds-m-left_small"
                            label="Clone"
                            variant="brand"
                            disabled={disableClone}
                            onclick={handleClone}>
                        </lightning-button>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
