<template>
    <div class="slds-p-around_small">
        <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center slds-m-bottom_small">
            <lightning-button-icon icon-name="utility:add" variant="brand" title="Add Contracts" alternative-text="Add Contracts" onclick={openAssignPanel}></lightning-button-icon>
        </div>
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <template lwc:if={showAssignPanel}>
            <div class="assign-panel slds-box slds-m-bottom_small">
                <div class="slds-grid slds-gutters slds-m-bottom_small">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input label="Contract Name" value={contractNameInput} onchange={handleContractNameChange} onkeyup={handleSearchKeyUp}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <template lwc:if={showAccountPicker}>
                            <lightning-record-picker object-api-name="Account" label="Account" onchange={handleAccountChange}></lightning-record-picker>
                        </template>
                    </div>
                </div>
                <lightning-button label="Search" variant="brand" onclick={handleSearchClick}></lightning-button>
                <lightning-button label="Clear" class="slds-m-left_x-small" onclick={handleSearchClear}></lightning-button>

                <template lwc:if={isSearching}>
                    <lightning-spinner alternative-text="Searching" size="small"></lightning-spinner>
                </template>

                <template lwc:if={hasSearched}>
                    <div class="results-table-wrapper slds-m-vertical_small">
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th style="width: 2.5rem;"></th>
                                    <th scope="col"><div class="slds-truncate">Contract Name</div></th>
                                    <th scope="col"><div class="slds-truncate">Account Name</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={contractOptions} for:item="c">
                                    <tr key={c.Id} class="slds-hint-parent">
                                        <td><lightning-input type="checkbox" variant="label-hidden" checked={c.selected} data-id={c.Id} onchange={handleContractCheckbox}></lightning-input></td>
                                        <td><div class="slds-truncate">{c.Name}</div></td>
                                        <td><div class="slds-truncate">{c.accountName}</div></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template lwc:if={showNoResults}>
                            <p class="slds-text-align_center slds-text-color_weak slds-p-around_medium">No Contracts found.</p>
                        </template>
                    </div>
                </template>

                <div class="slds-grid slds-grid_align-end">
                    <lightning-button label="Cancel" class="slds-m-right_x-small" onclick={closeAssignPanel}></lightning-button>
                    <lightning-button variant="brand" label="Add" disabled={disableAdd} onclick={handleAddSave}></lightning-button>
                </div>
            </div>
        </template>

        <template lwc:if={hasContracts}>
            <div class="results-table-wrapper">
                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Contract Name</div></th>
                            <th scope="col"><div class="slds-truncate">Account Name</div></th>
                            <th style="width: 3rem;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={contracts} for:item="c">
                            <tr key={c.Id} class="slds-hint-parent">
                                <td><div class="slds-truncate">{c.Name}</div></td>
                                <td><div class="slds-truncate">{c.accountName}</div></td>
                                <td>
                                    <lightning-button-icon icon-name="utility:delete" title="Remove" alternative-text="Remove" data-id={c.Id} onclick={handleRemove}></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <template lwc:else>
            <p class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">No Contracts assigned to this Rate Agreement.</p>
        </template>
    </div>
</template>
