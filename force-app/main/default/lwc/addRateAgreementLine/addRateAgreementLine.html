<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <lightning-button-icon class="slds-modal__close" icon-name="utility:close" alternative-text="Close" onclick={close}></lightning-button-icon>
                <h2 class="slds-text-heading_medium">Add Rate Agreement Line</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <template lwc:if={isSaving}>
                    <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                </template>

                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    Default Employer On Cost rows will be copied onto this line automatically and can be edited afterward.
                </p>

                <lightning-record-edit-form
                    object-api-name="Rate_Agreement_Lines__c"
                    onsubmit={handleSubmit}
                    onsuccess={handleSuccess}
                    onerror={handleError}>
                    <lightning-messages></lightning-messages>
                    <lightning-input-field field-name="Rate_Agreement_Version__c" value={versionId} class="slds-hide"></lightning-input-field>
                    <lightning-input-field field-name="Worker_Type__c"></lightning-input-field>
                    <lightning-input-field field-name="Min_Scale__c"></lightning-input-field>
                    <lightning-input-field field-name="Max_Scale__c"></lightning-input-field>
                    <lightning-input-field field-name="Calc_Type__c"></lightning-input-field>
                    <lightning-input-field field-name="Margin_Value__c"></lightning-input-field>

                    <div class="slds-m-top_medium slds-text-align_right">
                        <lightning-button label="Cancel" onclick={close} disabled={isSaving}></lightning-button>
                        <lightning-button class="slds-m-left_small" type="submit" label="Save" variant="brand" disabled={isSaving}></lightning-button>
                    </div>
                </lightning-record-edit-form>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
