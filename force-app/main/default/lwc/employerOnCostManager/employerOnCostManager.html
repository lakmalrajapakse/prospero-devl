<template>
    <lightning-card title="Employer On Cost Manager" icon-name="standard:currency">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="slds-grid slds-grid_vertical-align-end slds-gutters">
                <div class="slds-col slds-size_4-of-5">
                    <lightning-record-picker
                        label="Employer On Cost"
                        placeholder="Search Employer On Cost..."
                        object-api-name={rateAgreementObjectApiName}
                        filter={agreementFilter}
                        value={selectedAgreementId}
                        onchange={handlePickerChange}>
                    </lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <lightning-button
                        class="slds-button_stretch"
                        label="New"
                        icon-name="utility:add"
                        onclick={openNewAgreementModal}>
                    </lightning-button>
                </div>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={showCostsTable}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small slds-grid slds-grid_align-end">
                <lightning-button-icon
                    icon-name="utility:add"
                    variant="brand"
                    alternative-text="Add Employer On Cost"
                    title="Add Employer On Cost"
                    onclick={openAddCostModal}>
                </lightning-button-icon>
            </div>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <lightning-datatable
                    key-field="Id"
                    data={costs}
                    columns={costColumns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </div>
        </template>

        <template lwc:if={showEmptyState}>
            <div class="slds-box slds-text-align_center slds-m-around_medium">
                <lightning-empty-state illustration-name="cart:noitems" title="No Employer On Cost">
                <p slot="description"> No Employer On Cost added yet for this Rate Agreement.</p>
                    <lightning-button
                    label="Add Employer On Cost"
                    icon-name="utility:add"
                    variant="brand"
                    slot="cta"
                    onclick={openAddCostModal}>
                </lightning-button>
                </lightning-empty-state>
                
            </div>
        </template>
    </lightning-card>

    <!-- New Rate Agreement modal -->
    <template lwc:if={showNewAgreementModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        class="slds-modal__close"
                        alternative-text="Close"
                        onclick={closeNewAgreementModal}>
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">New Rate Agreement</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={isSavingAgreement}>
                        <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                    </template>
                    <lightning-input
                        label="Agreement Name"
                        value={newAgreementName}
                        onchange={handleNewAgreementNameChange}
                        required>
                    </lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeNewAgreementModal}></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small"
                        label="Save"
                        variant="brand"
                        onclick={handleCreateAgreement}
                        disabled={isSavingAgreement}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Add Employer On Cost modal -->
    <template lwc:if={showAddCostModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        class="slds-modal__close"
                        alternative-text="Close"
                        onclick={closeAddCostModal}>
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Add Employer On Cost</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={isSavingCost}>
                        <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
                    </template>
                    <lightning-record-edit-form
                        class="cost-form"
                        object-api-name={employerOnCostObjectApiName}
                        onsubmit={handleCostFormSubmit}
                        onsuccess={handleCostFormSuccess}
                        onerror={handleCostFormError}>
                        <lightning-messages></lightning-messages>
                        <lightning-input-field field-name={onCostTypeFieldName}></lightning-input-field>
                        <lightning-input-field field-name={calcTypeFieldName}></lightning-input-field>
                        <lightning-input-field field-name={valueFieldName}></lightning-input-field>
                        <lightning-input-field field-name={workerTypeFieldName}></lightning-input-field>
                        <div class="slds-m-top_medium slds-text-align_right">
                            <lightning-button label="Cancel" onclick={closeAddCostModal}></lightning-button>
                            <lightning-button
                                class="slds-m-left_x-small"
                                type="submit"
                                label="Save"
                                variant="brand"
                                disabled={isSavingCost}>
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
